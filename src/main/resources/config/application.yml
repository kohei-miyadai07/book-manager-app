spring:
  application:
    name: book-manager-app
  datasource:
    url: jdbc:h2:mem:bookdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  sql:
    init:
      mode: always
      data-locations:
      - classpath:db/sql/data.sql
logging:
  level:
    '[jp.ne.zaq.jcom.book_manager_app]': INFO
